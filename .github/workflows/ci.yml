# CI gate (D-058): local Supabase with migrations and the isolation test,
# build, lint, typecheck, unit tests, client-bundle guard, page weight, Playwright.
# Actions are pinned to full commit SHAs (release in the comment), each at
# least 14 days old when pinned. No secrets.
name: CI

on:
  pull_request:
  push:
    branches: [staging, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"
  TURBO_TELEMETRY_DISABLED: "1"

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # No version input: pnpm comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Local Supabase at pinned versions (the CLI pins every image). Nothing here
      # talks to a hosted project; the keys below are the CLI's public local defaults.
      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.122.0

      - name: Migration guard (additive only, reserved slugs match)
        run: pnpm db:check

      - name: Start local Supabase (migrations and seed)
        run: supabase start -x studio,realtime,imgproxy,edge-runtime,logflare,vector,supavisor,postgres-meta

      - name: Database tests (isolation test, schema checks)
        run: supabase test db

      - name: Local Supabase settings for the app
        run: |
          supabase status -o json | jq -r '
            "NEXT_PUBLIC_SUPABASE_URL=\(.API_URL)",
            "NEXT_PUBLIC_SUPABASE_ANON_KEY=\(.ANON_KEY)",
            "SUPABASE_SERVICE_ROLE_KEY=\(.SERVICE_ROLE_KEY)",
            "MAILPIT_URL=\(.MAILPIT_URL)"' >> "$GITHUB_ENV"

      - name: Build without a database (settings missing; database unreachable)
        run: pnpm check:build

      - name: Build
        run: pnpm build

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Client bundle guard (no service role key, no Supabase code in the browser)
        run: pnpm check:bundle

      - name: Install Chromium for Playwright
        run: pnpm exec playwright install --with-deps chromium

      - name: Page weight (first view of every guest page, 300 KB budget)
        run: pnpm weight-check --skip-build --json weight.json

      - name: Slow-3G timing (report only)
        run: pnpm speed-check --json speed.json

      - name: Playwright (production server)
        run: pnpm e2e

      - name: Keep the weight and timing reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: speed-reports
          path: |
            weight.json
            speed.json
          if-no-files-found: ignore
          retention-days: 30
