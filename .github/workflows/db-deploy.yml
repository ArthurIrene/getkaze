# Apply new migrations to the Supabase STAGING project (specs/db-testing-and-migrations.md).
# Runs only after CI passes on a push to staging (a merge), never on pull requests.
# The live project is never named here; its ref and keys are not in GitHub.
name: DB deploy (staging)

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [staging]
  workflow_dispatch:
    inputs:
      seed_demo:
        description: "Also apply the demo lodge seed (fake data, idempotent)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: db-deploy-staging
  cancel-in-progress: false

jobs:
  migrate:
    # After a successful CI run on a push to staging; or a manual run on the staging branch.
    if: >-
      (github.event_name == 'workflow_run'
        && github.event.workflow_run.conclusion == 'success'
        && github.event.workflow_run.event == 'push'
        && github.event.workflow_run.head_branch == 'staging')
      || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/staging')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: supabase-staging
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      # All three missing: staging is not set up yet, so skip cleanly (green, with a notice).
      # Some set, some missing: a broken setup, so fail.
      - name: Check settings
        id: settings
        run: |
          missing=()
          for v in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD SUPABASE_PROJECT_REF; do
            if [ -z "${!v}" ]; then missing+=("$v"); fi
          done
          if [ ${#missing[@]} -eq 3 ]; then
            echo "::notice title=DB deploy skipped::staging not configured (no secrets or variables in the supabase-staging environment). See specs/db-testing-and-migrations.md."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          elif [ ${#missing[@]} -gt 0 ]; then
            for v in "${missing[@]}"; do echo "::error::$v is not set in the supabase-staging environment"; done
            exit 1
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.settings.outputs.configured == 'true'
        with:
          # Deploy exactly the commit CI tested.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.settings.outputs.configured == 'true'
        with:
          node-version-file: .nvmrc

      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        if: steps.settings.outputs.configured == 'true'
        with:
          version: 2.122.0

      - name: Migration guard (additive only)
        if: steps.settings.outputs.configured == 'true'
        run: node scripts/check-migrations.mjs

      - name: Link the staging project
        if: steps.settings.outputs.configured == 'true'
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Dry run (what would be applied)
        if: steps.settings.outputs.configured == 'true'
        run: supabase db push --dry-run --password "$SUPABASE_DB_PASSWORD"

      - name: Apply new migrations
        if: steps.settings.outputs.configured == 'true'
        run: supabase db push --password "$SUPABASE_DB_PASSWORD"

      - name: Apply the demo seed (manual runs only, when asked)
        if: steps.settings.outputs.configured == 'true' && github.event_name == 'workflow_dispatch' && inputs.seed_demo
        run: supabase db push --include-seed --password "$SUPABASE_DB_PASSWORD"
